name: Foundry Benchmarks

permissions: {}

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Comma-separated Foundry versions (optional, defaults to 'master,local'). Include 'local' to compare the branch HEAD against a source-built 'master' baseline and post a PR comment. Omit 'local' (e.g. 'stable,nightly') to track released versions and commit results."
        required: false
        type: string
      baseline_ref:
        description: "Baseline git ref to build for the PR comparison (optional; defaults to the merge-base of HEAD and origin/master)."
        required: false
        type: string
      repos:
        description: "Comma-separated repos to benchmark. Each entry: org/repo[:rev] (e.g. aave/aave-v4:af1f0f2ba323ac6fbaaee3abf6be060c78e22d35). Leave empty to use the per-benchmark default repo lists."
        required: false
        type: string
      pr_number:
        description: "PR to benchmark and comment on. Set by the `derek bench` dispatcher; the candidate is the PR head fetched via refs/pull/<n>/head. Leave empty for manual branch runs."
        required: false
        type: string
      head_sha:
        description: "Expected PR head SHA at dispatch time (advisory; logged if the head has since advanced)."
        required: false
        type: string

env:
  DEFAULT_VERSIONS: "master,local"

  # Repos to benchmark per step. Each comma-separated entry has the form
  #   org/repo[:rev][ <extra args>]
  # where anything after the first whitespace is appended to every benchmark
  # command for that repo (use this to skip a broken test contract via e.g.
  # `--nmc BrokenTest`, so a single failing test does not fail the whole CI).
  TEST_REPOS: >-
    ithacaxyz/account:v0.5.7,
    vectorized/solady:v0.1.26 --nmc 'LifebuoyTest|LibBitTest|Base58Test|LibStringTest',
    uniswap/v4-core:46c6834698c48bc4a463a86d8420f4eb1d7f3b75 --nmc 'TickMathTestTest',
    sparkdotfi/spark-psm:v1.0.0 --nmc PSMInvariants_TimeBasedRateSetting_WithTransfers_WithPocketSetting

  ISOLATE_TEST_REPOS: >-
    ithacaxyz/account:v0.5.7 --nmc SimulateExecuteTest,
    vectorized/solady:v0.1.26 --nmc 'SafeTransferLibTest|LifebuoyTest|LibBitTest|Base58Test|LibStringTest',
    uniswap/v4-core:46c6834698c48bc4a463a86d8420f4eb1d7f3b75 --nmc 'TickMathTestTest',
    sparkdotfi/spark-psm:v1.0.0 --nmc PSMInvariants_TimeBasedRateSetting_WithTransfers_WithPocketSetting

  SYMBOLIC_REPOS: >-
    Vectorized/solady:v0.1.26,
    SorellaLabs/angstrom:73b55b8eca667b9a50fa4d8b6a7f45ec647420f5,
    farcasterxyz/contracts:3f37e21db8e9c6319b4a3d5f62b1c514ef01c36b

  BUILD_REPOS: >-
    ithacaxyz/account:v0.5.7,
    vectorized/solady:v0.1.26,
    uniswap/v4-core:46c6834698c48bc4a463a86d8420f4eb1d7f3b75,
    sparkdotfi/spark-psm:v1.0.0

  COVERAGE_REPOS: >-
    ithacaxyz/account:v0.5.7 --nmc SimulateExecuteTest,
    uniswap/v4-core:46c6834698c48bc4a463a86d8420f4eb1d7f3b75,
    sparkdotfi/spark-psm:v1.0.0 --nmc PSMInvariants_TimeBasedRateSetting_WithTransfers_WithPocketSetting

jobs:
  # Resolve the dispatched request. Two modes:
  #   * comment path (pr_number input set): the candidate is the PR head fetched
  #     via refs/pull/<n>/head; the PR is verified open and in this repo (no
  #     forks). The dispatcher runs this workflow on master, so the harness and
  #     publish scripts come from a trusted ref, not the PR.
  #   * manual path (no pr_number): resolve the open PR for the dispatched branch
  #     and benchmark that branch HEAD.
  authorize:
    name: Authorize request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      versions: ${{ steps.req.outputs.versions }}
      repos: ${{ steps.req.outputs.repos }}
      baseline_ref: ${{ steps.req.outputs.baseline_ref }}
      checkout_ref: ${{ steps.req.outputs.checkout_ref }}
      candidate_ref: ${{ steps.req.outputs.candidate_ref }}
      pr_number: ${{ steps.req.outputs.pr_number }}
      actor: ${{ steps.req.outputs.actor }}
    steps:
      - name: Resolve request
        id: req
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_VERSIONS: ${{ env.DEFAULT_VERSIONS }}
          IN_VERSIONS: ${{ github.event.inputs.versions }}
          IN_BASELINE: ${{ github.event.inputs.baseline_ref }}
          IN_REPOS: ${{ github.event.inputs.repos }}
          IN_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          IN_HEAD_SHA: ${{ github.event.inputs.head_sha }}
          DISPATCH_REF: ${{ github.ref_name }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          versions="${IN_VERSIONS:-$DEFAULT_VERSIONS}"
          baseline="${IN_BASELINE:-}"
          repos="${IN_REPOS:-}"
          checkout_ref="$DISPATCH_SHA"
          if [ -n "$IN_PR_NUMBER" ]; then
            # Comment path: resolve and verify the PR by number.
            pr_json="$(gh api "repos/${GH_REPO}/pulls/${IN_PR_NUMBER}")"
            state="$(printf '%s' "$pr_json" | jq -r '.state // empty')"
            head_repo="$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name // empty')"
            head_sha="$(printf '%s' "$pr_json" | jq -r '.head.sha // empty')"
            actor="$(printf '%s' "$pr_json" | jq -r '.user.login // empty')"
            if [ "$state" != "open" ]; then
              echo "::error::PR #${IN_PR_NUMBER} is not open." >&2
              exit 1
            fi
            if [ "$head_repo" != "$GH_REPO" ]; then
              echo "::error::PR #${IN_PR_NUMBER} head is not in ${GH_REPO}; forks are not benchmarked." >&2
              exit 1
            fi
            if [ -n "$IN_HEAD_SHA" ] && [ "$IN_HEAD_SHA" != "$head_sha" ]; then
              echo "::warning::PR head advanced since dispatch (${IN_HEAD_SHA} -> ${head_sha}); benchmarking current head."
            fi
            pr_number="$IN_PR_NUMBER"
            candidate_ref="refs/pull/${IN_PR_NUMBER}/head"
          else
            # Manual path: resolve the open PR for the dispatched branch.
            owner="${GH_REPO%%/*}"
            pr_json="$(gh api --method GET "repos/${GH_REPO}/pulls" \
              -f state=open -f "head=${owner}:${DISPATCH_REF}" --jq '.[0]')"
            pr_number="$(printf '%s' "$pr_json" | jq -r '.number // empty')"
            actor="$(printf '%s' "$pr_json" | jq -r '.user.login // empty')"
            candidate_ref=""
          fi
          {
            echo "versions=$versions"
            echo "baseline_ref=$baseline"
            echo "repos=$repos"
            echo "checkout_ref=$checkout_ref"
            echo "candidate_ref=$candidate_ref"
            echo "pr_number=$pr_number"
            echo "actor=$actor"
          } >> "$GITHUB_OUTPUT"

  run-benchmarks:
    name: Run All Benchmarks
    needs: authorize
    runs-on: depot-ubuntu-24.04-32
    # Source-built baseline/candidate use the profiling profile, forge only.
    env:
      FOUNDRY_BENCH_LOCAL_BUILD_PROFILE: profiling
      FOUNDRY_BENCH_LOCAL_BUILD_BINS: forge
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize.outputs.checkout_ref }}
          persist-credentials: false
          # Full history so the baseline merge-base can be resolved.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config z3

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      # No sccache: this job builds untrusted PR code (the candidate), which must
      # not write to the shared Actions cache (cache poisoning).

      - name: Setup Foundry
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          ./.github/scripts/setup-foundryup.sh
          printf '%s\n' "$GITHUB_WORKSPACE/.foundry/bin" >> "$GITHUB_PATH"

      - name: Build benchmark binary
        run: cargo build --locked --release --bin foundry-bench

      - name: Install hyperfine
        run: |
          curl -L https://github.com/sharkdp/hyperfine/releases/download/v1.19.0/hyperfine-v1.19.0-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv hyperfine-v1.19.0-x86_64-unknown-linux-gnu/hyperfine /usr/local/bin/
          rm -rf hyperfine-v1.19.0-x86_64-unknown-linux-gnu

      # PR mode (versions contains "local"): build both sides from worktrees so
      # this job never activates the (trusted) checkout as the candidate.
      #   * candidate: the PR head (candidate_ref) or, for manual runs, HEAD.
      #   * baseline: baseline_ref or the merge-base of the candidate and master.
      # Otherwise pass versions through unchanged (foundryup release tracking).
      - name: Prepare comparison
        id: prep
        env:
          VERSIONS: ${{ needs.authorize.outputs.versions }}
          BASELINE_REF_INPUT: ${{ needs.authorize.outputs.baseline_ref }}
          CANDIDATE_REF: ${{ needs.authorize.outputs.candidate_ref }}
        run: |
          if printf '%s' "$VERSIONS" | grep -q 'local'; then
            git fetch --no-tags origin master:refs/remotes/origin/master
            if [ -n "$CANDIDATE_REF" ]; then
              git fetch --no-tags origin "$CANDIDATE_REF"
              CAND_SHA="$(git rev-parse FETCH_HEAD)"
            else
              CAND_SHA="$(git rev-parse HEAD)"
            fi
            git worktree add --detach ../foundry-candidate "$CAND_SHA"
            BASE_REF="${BASELINE_REF_INPUT:-}"
            if [ -z "$BASE_REF" ]; then
              BASE_REF="$(git merge-base "$CAND_SHA" origin/master)"
            fi
            git worktree add --detach ../foundry-baseline "$BASE_REF"
            echo "effective_versions=master=../foundry-baseline,local=../foundry-candidate" >> "$GITHUB_OUTPUT"
            echo "baseline_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
            echo "Candidate: $CAND_SHA | baseline: $BASE_REF"
          else
            echo "effective_versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          fi

      - name: Run forge test benchmarks
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
          VERSIONS: ${{ steps.prep.outputs.effective_versions }}
          REPOS: ${{ needs.authorize.outputs.repos || env.TEST_REPOS }}
        run: |
          ./target/release/foundry-bench --output-dir ./benches --force-install \
            --versions "$VERSIONS" \
            --repos "$REPOS" \
            --benchmarks forge_test,forge_fuzz_test \
            --output-file forge_test_bench.md \
            --json-output forge_test_bench.json \
            --verbose

      - name: Run forge isolate test benchmarks
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
          VERSIONS: ${{ steps.prep.outputs.effective_versions }}
          REPOS: ${{ needs.authorize.outputs.repos || env.ISOLATE_TEST_REPOS }}
        run: |
          ./target/release/foundry-bench --output-dir ./benches \
            --versions "$VERSIONS" \
            --repos "$REPOS" \
            --benchmarks forge_isolate_test \
            --output-file forge_isolate_test_bench.md \
            --json-output forge_isolate_test_bench.json \
            --verbose

      # Temporarily disabled as long as the previous stable benchmark baseline
      # does not support symbolic execution.
      # - name: Run forge symbolic benchmarks
      #   env:
      #     FOUNDRY_DIR: ${{ github.workspace }}/.foundry
      #     VERSIONS: ${{ github.event.inputs.versions || env.DEFAULT_VERSIONS }}
      #     REPOS: ${{ github.event.inputs.repos || env.SYMBOLIC_REPOS }}
      #   run: |
      #     ./target/release/foundry-bench --output-dir ./benches \
      #       --versions "$VERSIONS" \
      #       --repos "$REPOS" \
      #       --benchmarks forge_symbolic_test \
      #       --output-file forge_symbolic_bench.md \
      #       --verbose

      - name: Run forge build benchmarks
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
          VERSIONS: ${{ steps.prep.outputs.effective_versions }}
          REPOS: ${{ needs.authorize.outputs.repos || env.BUILD_REPOS }}
        run: |
          ./target/release/foundry-bench --output-dir ./benches \
            --versions "$VERSIONS" \
            --repos "$REPOS" \
            --benchmarks forge_build_no_cache,forge_build_with_cache \
            --output-file forge_build_bench.md \
            --json-output forge_build_bench.json \
            --verbose

      - name: Run forge coverage benchmarks
        env:
          FOUNDRY_DIR: ${{ github.workspace }}/.foundry
          VERSIONS: ${{ steps.prep.outputs.effective_versions }}
          REPOS: ${{ needs.authorize.outputs.repos || env.COVERAGE_REPOS }}
        run: |
          ./target/release/foundry-bench --output-dir ./benches \
            --versions "$VERSIONS" \
            --repos "$REPOS" \
            --benchmarks forge_coverage \
            --output-file forge_coverage_bench.md \
            --json-output forge_coverage_bench.json \
            --verbose

      - name: Combine benchmark results
        run: ./.github/scripts/combine-benchmarks.sh benches

      # Branch runs: merge the per-version summaries into baseline/candidate
      # files for the publish job to diff.
      - name: Merge per-version JSON summaries
        if: contains(needs.authorize.outputs.versions, 'local')
        env:
          BASELINE_REF: ${{ steps.prep.outputs.baseline_ref }}
        run: |
          shopt -s nullglob
          base_parts=( benches/*_bench-master.json )
          cand_parts=( benches/*_bench-local.json )
          if [[ ${#base_parts[@]} -gt 0 ]]; then
            jq -s 'add' "${base_parts[@]}" > benches/base-summary.json
            echo "Merged ${#base_parts[@]} baseline summary file(s)."
          fi
          if [[ ${#cand_parts[@]} -gt 0 ]]; then
            jq -s 'add' "${cand_parts[@]}" > benches/candidate-summary.json
            echo "Merged ${#cand_parts[@]} candidate summary file(s)."
          fi
          printf '%s\n' "$BASELINE_REF" > benches/baseline-ref.txt

      - name: Print benchmark results
        run: cat benches/LATEST.md

      - name: Upload benchmark results as artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          # The symbolic benchmark artifact is omitted while the symbolic step is disabled.
          path: |
            benches/forge_test_bench.md
            benches/forge_isolate_test_bench.md
            benches/forge_build_bench.md
            benches/forge_coverage_bench.md
            benches/LATEST.md
            benches/base-summary.json
            benches/candidate-summary.json
            benches/baseline-ref.txt

  publish-results:
    name: Publish Results
    needs: [authorize, run-benchmarks]
    runs-on: ubuntu-latest
    # Runs on failure too, so a failed run still reports status to the PR.
    if: always()
    # All git writes happen here, on a clean runner that never executed
    # third-party benchmark code. Scripts come from the dispatched ref; the
    # comment path dispatches on master, so they are trusted, not PR-controlled.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository # zizmor: ignore[artipacked] persists credentials to push benchmark data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: true

      - name: Download benchmark results
        if: needs.run-benchmarks.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results
          path: benches/

      - name: Commit benchmark results
        id: commit_results
        if: needs.run-benchmarks.result == 'success' && !contains(needs.authorize.outputs.versions, 'local')
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: ./.github/scripts/commit-benchmark-results.sh benches "${{ github.event_name }}" "${{ github.repository }}"

      - name: Create PR for manual runs
        if: github.event_name == 'workflow_dispatch' && steps.commit_results.outputs.committed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH_NAME: ${{ steps.commit_results.outputs.branch_name }}
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;

            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'chore(bench): update benchmark results',
              head: branchName,
              base: 'master',
              body: `## Benchmark Results Update

            This PR contains the latest benchmark results from a manual workflow run.

            ---

            🤖 This PR was automatically generated by the [Foundry Benchmarks workflow](https://github.com/${{ github.repository }}/actions).`
            });

            console.log(`Created PR #${pr.number}: ${pr.html_url}`);

      # Diff the summaries and post a comment on the resolved PR.
      - name: Post benchmark summary to PR
        if: >-
          needs.run-benchmarks.result == 'success'
          && contains(needs.authorize.outputs.versions, 'local')
          && needs.authorize.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ needs.authorize.outputs.actor }}
          VERSIONS: ${{ needs.authorize.outputs.versions }}
          REPOS: ${{ needs.authorize.outputs.repos || 'per-benchmark defaults' }}
          BASE_LABEL: master
          CANDIDATE_LABEL: this PR
        run: |
          if [ ! -f benches/base-summary.json ] || [ ! -f benches/candidate-summary.json ]; then
            echo "::error::Merged benchmark summaries are missing after a successful run; cannot post PR report."
            exit 1
          fi
          BASELINE_REF="$(cat benches/baseline-ref.txt 2>/dev/null || true)"
          ./.github/scripts/compare-bench.sh \
            benches/base-summary.json benches/candidate-summary.json \
            > benches/comparison.md
          CONFIG="versions=${VERSIONS}; baseline=${BASELINE_REF:-master}; repos=${REPOS}" \
            ./.github/scripts/post-bench-comment.sh benches/comparison.md benches/LATEST.md

      # If the run failed, post a failure status so the requester is not left
      # with only the dispatcher's "queued" acknowledgement.
      - name: Post failure status to PR
        if: >-
          needs.run-benchmarks.result != 'success'
          && contains(needs.authorize.outputs.versions, 'local')
          && needs.authorize.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ needs.authorize.outputs.actor }}
          STATUS_PREFIX: "❌ Benchmark run failed — see the run log."
        run: ./.github/scripts/post-bench-comment.sh
