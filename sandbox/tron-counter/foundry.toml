[profile.default]
src = "src"
out = "out"
test = "test"
libs = []
network = "tron"
chain_id = 728126428
evm_version = "cancun"
# No `solc` key: on `network = "tron"` forge auto-resolves the native tron-solc
# (github.com/tronprotocol/solidity, tag tv_0.8.27, sha256-pinned) into
# ~/.foundry-tron/solc/tron-solc-0.8.27, downloading it once if absent. An
# explicit `solc = "/abs/path"` still overrides this for a locally built binary.
