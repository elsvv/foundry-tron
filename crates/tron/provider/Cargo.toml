[package]
name = "foundry-tron-provider"
description = "Async HTTP client for Tron nodes (TronGrid / java-tron wallet API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
foundry-tron-primitives = { path = "../primitives" }
alloy-primitives.workspace = true
alloy-signer.workspace = true
alloy-signer-local.workspace = true
prost.workspace = true
prost-types.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# golden energy parity: run the same call through the local tron-revm energy
# model and assert it matches the Nile node byte-for-byte.
foundry-evm-core.workspace = true
alloy-evm.workspace = true
revm.workspace = true
